<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="طقطقة: موقع تدريب على الكتابة بالعربي على أمثال مصرية وكلام مصري وحواديت وحكم وشعر.">
<title>طقطقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">

<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"TQ Sans";src:local("Thmanyah Sans"),local("thmanyah sans"),local("ThmanyahSans-Regular"),local("thmanyahsans-Regular");font-weight:400}
@font-face{font-family:"TQ Sans";src:local("Thmanyah Sans Medium"),local("ThmanyahSans-Medium"),local("thmanyahsans-Medium");font-weight:500}
@font-face{font-family:"TQ Sans";src:local("Thmanyah Sans Bold"),local("ThmanyahSans-Bold"),local("thmanyahsans-Bold");font-weight:700}
@font-face{font-family:"TQ Serif";src:local("Thmanyah Serif Text"),local("ThmanyahSerifText-Regular"),local("thmanyahseriftext-Regular");font-weight:400}
@font-face{font-family:"TQ Display";src:local("Thmanyah Serif Display Bold"),local("ThmanyahSerifDisplay-Bold"),local("thmanyahserifdisplay-Bold");font-weight:700}

/* Layout: one centered column — quiet settings line, the typing text as the only loud thing, keyboard below; chrome fades while typing */
:root{
  --bg:#eceee9; --panel:#e2e6df; --fg:#27302f; --dim:#8a9490; --sub:#9aa39f; --accent:#8c6a26; --caret:#8c6a26; --accent-soft:rgba(140,106,38,.12);
  --err:#b8473a; --err-dim:#8c3a2e; --line:#d3d8d0; --key:#f4f6f2; --key-fg:#3a4846; --key-edge:#c4ccc2; --scrim:rgba(20,30,28,.45);
  --f-pinky:#c9877a; --f-ring:#b39a4c; --f-mid:#6e9d79; --f-index:#6a8db6;
  --f-display:"TQ Display","Thmanyah Serif Display","Noto Naskh Arabic",serif;
  --f-sans:"TQ Sans","Thmanyah Sans","IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-serif:"TQ Serif","Thmanyah Serif Text","Noto Naskh Arabic","Geeza Pro",serif;
  --f-text:var(--f-sans);
  --f-ui:var(--f-sans);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171d1e; --panel:#1e2627; --fg:#e4dfd3; --dim:#7b8683; --sub:#56625f; --accent:#d2a65c; --caret:#d2a65c; --accent-soft:rgba(210,166,92,.12);
    --err:#e07a6a; --err-dim:#9c4a3e; --line:#29322f; --key:#1d2526; --key-fg:#a3ada9; --key-edge:#101516; --scrim:rgba(0,0,0,.55);
    --f-pinky:#c98b7d; --f-ring:#bba15a; --f-mid:#78a983; --f-index:#7898c0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171d1e; --panel:#1e2627; --fg:#e4dfd3; --dim:#7b8683; --sub:#56625f; --accent:#d2a65c; --caret:#d2a65c; --accent-soft:rgba(210,166,92,.12);
  --err:#e07a6a; --err-dim:#9c4a3e; --line:#29322f; --key:#1d2526; --key-fg:#a3ada9; --key-edge:#101516; --scrim:rgba(0,0,0,.55);
  --f-pinky:#c98b7d; --f-ring:#bba15a; --f-mid:#78a983; --f-index:#7898c0;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);transition:background .2s,color .2s}
body{font-family:var(--f-ui);font-size:15px;line-height:1.65;min-height:100%;-webkit-font-smoothing:antialiased}
html{--tsz:clamp(24px,3.2vw,31px)}
html.ts-s{--tsz:clamp(20px,2.6vw,25px)}
html.ts-l{--tsz:clamp(28px,4vw,38px)}
html.tf-serif .words,html.tf-serif .quote-done{font-family:var(--f-serif)}
.page{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.logo{font-family:var(--f-display);font-weight:700;font-size:34px;color:var(--fg);line-height:1}
.logo b{color:var(--accent);font-weight:700}
.tag{color:var(--sub);font-size:14px}
.hright{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pb{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.pb strong{color:var(--fg);font-weight:600}
.themebtn{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:8px;background:var(--panel);color:var(--fg);border:0;border-radius:999px;padding:5px 12px 5px 10px;cursor:pointer}
.themebtn .dots{display:inline-flex;gap:3px}
.themebtn .dots i{width:8px;height:8px;border-radius:50%;display:block}

.config{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--panel);border-radius:10px;padding:6px 10px}
.group{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.group + .group{border-inline-start:1px solid var(--line);padding-inline-start:14px}
.seg button{font:inherit;font-size:13.5px;background:none;border:0;color:var(--sub);padding:5px 9px;border-radius:6px;cursor:pointer;transition:color .15s}
.seg button:hover{color:var(--fg)}
.seg button.on{color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg .tog::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;margin-inline-end:6px;vertical-align:1px}
.seg .tog.on::before{background:currentColor}

.stage{position:relative}
.meta{display:flex;justify-content:space-between;align-items:baseline;min-height:34px;margin-bottom:6px;gap:12px}
.counter{font-family:var(--f-sans);font-weight:500;font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.live{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
.slab{position:relative;overflow:hidden;cursor:text;height:calc(3 * var(--lh,72px))}
.words{display:flex;flex-wrap:wrap;column-gap:.38em;row-gap:0;font-family:var(--f-text);font-size:var(--tsz);line-height:2.1;direction:rtl;user-select:none;transition:filter .2s,opacity .2s}
.w{color:var(--dim);white-space:nowrap;border-bottom:2px solid transparent}
.w .ok{color:var(--fg)}
.w .bad{color:var(--err)}
.w .extra{color:var(--err-dim)}
.w.err{border-bottom-color:var(--err)}
.caret{position:absolute;top:0;left:0;width:2.5px;border-radius:2px;background:var(--caret);transition:transform .08s linear;pointer-events:none}
.caret.idle{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.slab.blur .words{filter:blur(5px);opacity:.5}
.slab.blur .caret{opacity:0}
.focus-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--fg);pointer-events:none;text-align:center}
.under{margin-top:6px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--sub);font-size:13.5px;min-height:22px}
.navhint{font-variant-numeric:tabular-nums}
#ti{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;resize:none;color:transparent;background:transparent;caret-color:transparent;z-index:2}

/* keyboard */
.kbwrap{display:flex;flex-direction:column;gap:10px}
.kbhead{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;color:var(--sub);font-size:13px}
.kbhead .seg{background:var(--panel);border-radius:8px;padding:2px}
.kb{direction:ltr;display:flex;flex-direction:column;gap:5px;max-width:860px;width:100%;margin:0 auto}
.row{display:grid;gap:5px}
.r0{grid-template-columns:repeat(13,1fr) 2fr}
.r1{grid-template-columns:1.5fr repeat(12,1fr) 1.5fr}
.r2{grid-template-columns:1.8fr repeat(11,1fr) 2.2fr}
.r3{grid-template-columns:2.35fr repeat(10,1fr) 2.65fr}
.r4{grid-template-columns:3.5fr 7fr 3.5fr}
.k{position:relative;background:var(--key);color:var(--key-fg);border-radius:6px;box-shadow:0 2px 0 var(--key-edge);height:clamp(32px,5vw,46px);display:flex;align-items:center;justify-content:center;font-family:var(--f-sans);font-size:clamp(13px,1.9vw,18px);transition:background .12s,color .12s,transform .06s;min-width:0}
.k .lat{position:absolute;top:2px;left:5px;font-family:var(--f-ui);font-size:clamp(8px,1.1vw,10px);color:var(--sub);line-height:1.2}
.k .sh{position:absolute;bottom:1px;left:5px;font-size:clamp(9px,1.2vw,12px);color:var(--sub);line-height:1.2}
.k .fn{font-family:var(--f-ui);font-size:clamp(9px,1.25vw,12px);color:var(--sub)}
.k::after{content:"";position:absolute;bottom:4px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--fc,transparent);opacity:.85}
.k.next{background:var(--accent);color:var(--bg)}
.k.next .lat,.k.next .sh,.k.next .fn{color:var(--bg)}
.k.press{transform:translateY(2px);box-shadow:0 0 0 var(--key-edge)}
.k.flashbad{background:var(--err);color:var(--bg)}
.fp{--fc:var(--f-pinky)} .fr{--fc:var(--f-ring)} .fm{--fc:var(--f-mid)} .fi{--fc:var(--f-index)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;color:var(--sub);font-size:12.5px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-inline-end:6px}

/* results */
.results{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:22px 32px;align-items:start}
.big{display:flex;flex-direction:column;gap:14px}
.stat .lbl{color:var(--sub);font-size:13px}
.stat .val{font-family:var(--f-sans);font-weight:500;font-size:58px;line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums}
.stat .val.sm{font-size:44px}
.newpb{color:var(--accent);font-weight:600;font-size:14px}
.chartbox{min-width:0}
canvas{display:block;width:100%;height:190px}
.small{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:12px 36px}
.small .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.small .v i{font-style:normal;color:var(--sub);font-weight:400}
.quote-done{grid-column:1 / -1;font-family:var(--f-text);font-size:19px;line-height:1.95;max-width:62ch;color:var(--fg);border-inline-start:3px solid var(--accent);padding-inline-start:14px}
.quote-done small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--sub)}
.actions{grid-column:1 / -1;display:flex;gap:10px;flex-wrap:wrap}
.actions button{font:inherit;font-size:14px;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.actions button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
kbd{font-family:var(--f-ui);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--fg)}
.actions kbd{background:transparent;border-color:currentColor;color:inherit;opacity:.8;margin-inline-start:6px}
footer{color:var(--sub);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:8px}
footer .keys{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center}
footer a{color:var(--sub)}

/* theme picker */
.tpanel{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-block:calc(40px + env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tbox{background:var(--bg);color:var(--fg);border-radius:14px;width:min(760px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.thead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.thead input{flex:1 1 180px;min-width:0;font:inherit;font-size:15px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;direction:ltr;text-align:left}
.thead .seg{background:var(--panel);border-radius:8px;padding:2px}
.thead .x{font:inherit;background:none;border:0;color:var(--sub);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.tgrid{overflow:auto;padding:12px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.tcard{font:inherit;font-size:13px;direction:ltr;text-align:left;border-radius:8px;padding:9px 11px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid transparent;min-width:0}
.tcard span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard.cur{border-color:var(--accent)}
.tcard .dots{display:flex;gap:3px;flex:none}
.tcard .dots i{width:9px;height:9px;border-radius:50%;display:block}
.tcount{color:var(--sub);font-size:12.5px;padding:0 16px 12px}

/* وضع التركيز: الإطار بيهدى وانت بتكتب */
header,.config,footer,.kbhead,.legend,.under,.live{transition:opacity .35s ease}
body.typing header,body.typing .config,body.typing footer,body.typing .kbhead,body.typing .legend{opacity:0;pointer-events:none}
body.typing .under,body.typing .live{opacity:.55}
@media (max-width:640px){
  .results{grid-template-columns:minmax(0,1fr)}
  .big{flex-direction:row;gap:28px}
  .stat .val,.stat .val.sm{font-size:46px}
  .group + .group{border-inline-start:0;padding-inline-start:0}
  .config{gap:4px 10px}
  .tag{display:none}
}
@media (prefers-reduced-motion:reduce){.caret{transition:none}.caret.idle{animation:none}html,body,header,.config,footer,.kbhead,.legend,.under,.live{transition:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>

<div class="page" dir="rtl" lang="ar">
  <header>
    <div class="brand"><div class="logo">طقطقة<b>.</b></div><div class="tag">اتمرن على الكتابة بالعربي</div></div>
    <div class="hright">
      <div class="pb" id="pb"></div>
      <button class="themebtn" id="themebtn" type="button"><span class="dots" id="tdots"></span><span id="tname">طقطقة</span></button>
    </div>
  </header>

  <nav class="config" id="config" aria-label="إعدادات الاختبار">
    <div class="group seg" data-k="src">
      <button type="button" data-v="masry">أمثال مصرية</button>
      <button type="button" data-v="kalam">كلام مصري</button>
      <button type="button" data-v="hawadit">حواديت</button>
      <button type="button" data-v="hekam">حكم وتراث</button>
      <button type="button" data-v="sheer">شعر</button>
      <button type="button" data-v="mix">مكس</button>
      <button type="button" data-v="words">كلمات</button>
    </div>
    <div class="group seg" data-k="mode">
      <button type="button" data-v="time">وقت</button>
      <button type="button" data-v="words">عدد كلمات</button>
      <button type="button" data-v="quote">اقتباس</button>
    </div>
    <div class="group seg" data-k="time" id="g-time">
      <button type="button" data-v="15">١٥</button><button type="button" data-v="30">٣٠</button><button type="button" data-v="60">٦٠</button><button type="button" data-v="120">١٢٠</button>
    </div>
    <div class="group seg" data-k="words" id="g-words">
      <button type="button" data-v="10">١٠</button><button type="button" data-v="25">٢٥</button><button type="button" data-v="50">٥٠</button><button type="button" data-v="100">١٠٠</button>
    </div>
    <div class="group seg" data-k="qlen" id="g-qlen">
      <button type="button" data-v="all">الكل</button><button type="button" data-v="s">قصير</button><button type="button" data-v="m">متوسط</button><button type="button" data-v="l">طويل</button><button type="button" data-v="xl">طويل جدا</button>
    </div>
    <div class="group seg">
      <button type="button" class="tog" data-t="lenient" title="أ إ آ = ا ، ة = ه ، ى = ي">تساهل في الهمزات</button>
      <button type="button" class="tog" data-t="punct">علامات الترقيم</button>
      <button type="button" class="tog" data-t="kb">الكيبورد</button>
    </div>
    <div class="group seg" data-k="tfont" title="خط النص اللي بتكتبه">
      <button type="button" data-v="sans">ثمانية</button><button type="button" data-v="serif">ثمانية سيريف</button>
    </div>
    <div class="group seg" data-k="tsize" title="حجم النص">
      <button type="button" data-v="s" style="font-size:12px" aria-label="صغير">أ</button><button type="button" data-v="m" style="font-size:14.5px" aria-label="عادي">أ</button><button type="button" data-v="l" style="font-size:17px" aria-label="كبير">أ</button>
    </div>
  </nav>

  <section class="stage" id="stage">
    <div class="meta"><div class="counter" id="counter"></div><div class="live" id="live"></div></div>
    <div class="slab" id="slab">
      <div class="words" id="words"></div>
      <div class="caret idle" id="caret"></div>
      <div class="focus-msg" id="fmsg" hidden>اضغط هنا أو اكتب أي حرف عشان تبدأ</div>
      <textarea id="ti" dir="rtl" lang="ar" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="اكتب هنا"></textarea>
    </div>
    <div class="under"><span id="src"></span><span class="navhint" id="navhint"></span></div>
  </section>

  <section id="results" hidden></section>

  <section class="kbwrap" id="kbwrap">
    <div class="kbhead">
      <span>ترتيب الكيبورد</span>
      <div class="seg" data-k="layout" id="g-layout">
        <button type="button" data-v="pc">ويندوز (Arabic PC)</button>
        <button type="button" data-v="mac">ماك</button>
      </div>
    </div>
    <div class="kb" id="kb"></div>
    <div class="legend">
      <span style="--c:var(--f-pinky)">الخنصر</span><span style="--c:var(--f-ring)">البنصر</span><span style="--c:var(--f-mid)">الوسطى</span><span style="--c:var(--f-index)">السبابة</span>
    </div>
  </section>

  <footer>
    <div class="keys"><span><kbd>Tab</kbd> النص اللي بعده</span><span><kbd>Shift</kbd>+<kbd>Tab</kbd> النص اللي قبله</span><span><kbd>Esc</kbd> إعادة نفس النص</span><span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> الثيمات</span></div>
    <div>الخط: ثمانية لو متسطّب على جهازك. الثيمات وترتيب ماك وجزء من النصوص من <a href="https://github.com/monkeytypegame/monkeytype" target="_blank" rel="noopener">Monkeytype</a>، برخصة <bdi>GPL-3.0</bdi></div>
  </footer>
</div>

<div class="tpanel" id="tpanel" hidden>
  <div class="tbox" role="dialog" aria-label="الثيمات">
    <div class="thead">
      <input id="tsearch" type="search" placeholder="search…" aria-label="دور على ثيم" autocomplete="off">
      <div class="seg" data-k="tfilter" id="g-tf">
        <button type="button" data-v="dark">غامق</button><button type="button" data-v="light">فاتح</button><button type="button" data-v="all">الكل</button>
      </div>
      <button type="button" class="x" id="tclose" aria-label="قفل">×</button>
    </div>
    <div class="tcount" id="tcount"></div>
    <div class="tgrid" id="tgrid"></div>
  </div>
</div>

<script>
const MT={"MT_PD":[["أكرم ضيفك وإن كان حقيراً، وقم على مجلسك لأبيك ومعلمك وإن كنت أميراً.","علي بن أبي طالب"],["ذهاب النظر خير من النظر إلى ما يوجب الفتنة. صحبة الأخيار تكسب الخير، كالريح إذا مرت بالطيب حملت طيباً.","علي بن أبي طالب"],["مسرة الكرام في بذل العطاء، ومسرة اللئام في سوء الجزاء.","علي بن أبي طالب"],["من لم يمت بالسيف مات بغيره، تعددت الأسباب والموت واحد","أبو الطيب المتنبي"],["ما كل ما يتمنى المرء يدركه، تجري الرياح بما لا تشتهي السفن.","أبو الطيب المتنبي"],["من سمع بأذنه صار حاكياً، ومن أصغى بقلبه كان واعياً، ومن وعظ بفعله كان هادياً.","محمد بن ادريس الشافعي"],["دع الأيام تفعل ما تشاء، وطب نفساً إذا حكم القضاء. ولا تجزع لحادثة الليالي، فما لحوادث الدنيا بقاء. وكن رجلاً على الأهوال جلداً، وشيمتك السماحة والوفاء.","محمد بن ادريس الشافعي"],["من صدق في أخيه، قبل علله، وسد خلله، وغفر زلله.","محمد بن ادريس الشافعي"],["إذا اعتذر إليكَ معتذرٌ، فتلقهُ بوجهٍ مشرقٍ وبِشرٍ ولسانٍ طلقٍ إلا أن يكونَ ممن قطيعتهُ غنيمة.","عبد الله بن المقفع"],["إن كل نظرية تحتمل التصديق والتكذيب لا يصح الأخذ بها إلا مع الدليل القاطع.","جابر بن حيان"],["من كان دؤوباً كان عالماً حقاً، ومن لم يكن دؤوباً لم يكن عالماً، وحسبك بالدربة في جميع الصنائع. إن الصناعي الدرب يحذق، وغير الدرب يعطل.","جابر بن حيان"],["إن العلم سابق أول، والعمل متأخر مستأنف، وكل من لم يسبق إلى العلم لم يمكنه إتيان العمل.","جابر بن حيان"],["إننا نذكر في هذا الكتاب خواص ما رأيناه فقط، دون ما سمعناه، أو قيل لنا أو قرأناه، بعد أن امتحناه وجربناه، فما صحّ أوردناه، وما بطل رفضناه، وما استخرجناه نحن أيضا قايسناه على أحوال هؤلاء القوم.","جابر بن حيان"],["واعلم أنها صنعة تحتاج إلى دربة، بل هي أعظم، لأنها غير موجودة في الحس، وإنما هي شيء قائم في العقل، فمن أطال درسه كانت سرعته في التراكيب على قدر ذلك ومن قصّر كان على حالته.","جابر بن حيان"],["إني أحرض أهل البخل كلهم، لو كان ينفع أهل البخل تحريضي. ما قل مالي إلا زادني كرماً، حتى يكون برزق الله تعويضي.","المقنع الكندي"],["من بخل بالعلم ابتلى بثلاث: إما موت فيذهب علمه، إما ينسى، وإما يصحب فيذهب عمله","عبد الله بن المبارك"],["من صبر فما أقل ما يصبر، ومن جزع فما أقل ما يتمتع","عبد الله بن المبارك"],["يا بني إياك والكسل والضجر، فإنهما مفتاح كل شر، إنك إن كسلت لم تؤد حقاً، وإن ضجرت لم تصبر على حق.","محمد بن علي بن الحسين بن علي أبي طالب"],["إذا رأيت الرجل يعمل الحسنة، فاعلم أن لها عنده أخوات، وإذا رأيته يعمل السيئة، فاعلم أن لها عنده أخوات، فإن الحسنة تدل على أختها، وإن السيئة تدل على أختها","عروة بن الزبير"],["مكتوب في الحكمة: لتكن كلمتك طيبة، وليكن وجهك بسطاً، تكن أحب إلى الناس ممن يعطيهم العطاء.","عروة بن الزبير"],["الكلام الحسن حسن، وأحسن من الكلام معناه، وأحسن من معناه استعماله، وأحسن من استعماله ثوابه، وأحسن من ثوابه رضا من يعمل له.","يحيى بن معاذ الرازي"],["الناس ثلاثة رجال: رجل شغله معاده عن معاشه، ورجل شغله معاشه عن معاده، ورجل مشغول بهما جميعاً، فالأولى درجة الفائزين، والثانية درجة الهالكين، والثالثة درجة المخاطرين.","يحيى بن معاذ الرازي"],["عجبت ممن يحزن على نقصان ماله كيف لا يحزن على نقصان عمره.","يحيى بن معاذ الرازي"],["الزهد ثلاثة أشياء: القلة، والخلوة، والجوع، وكان يقول: جوع التوابين تجربة، وجوع الزاهدين سياسة، وجوع الصديقين تكرمة.","يحيى بن معاذ الرازي"],["يا بني احذر الصرعة على الغفلة، حين لا تستجاب الدعوة، ولا سبيل إلى الرجعة، ولا تغترن بطول العافية، فإنما هو أجل ليس دونه فناء، ولا بعد أن تستكمله بقاء.","عمر بن عبد العزيز"],["يقال: إن استطعت فكن عالماً، فإن لم تستطع فكن متعلماً، فإن لم تستطع فأحبهم، فإن لم تستطع فلا تبغضهم.","عون بن عبد الله"],["الله لم يعصم العلماء من الخطأ، ولم يحمِ العلم من القصور والنقص، لو كان هذا هو الحال، لما اختلف العلماء على أيّ من مسائل العلم.","الحسن بن الهيثم"],["الحقائق غامضة، والغايات خفية، والشبهات كثيرة، والأفهام كدرة، والمقاييس مختلفة، والمقدمات ملتقطة من الحواس، والحواس التي هي العدد غير مأمونة الغلط. طريق النظر معفى الأثر، والباحث المجتهد غير معصوم من الزلل؛ فلذلك تكثر الحيرة عند المباحث اللطيفة، وتتشتت الآراء، وتفترق الظنون، وتختلف النتائج، ويتعذر اليقين.","الحسن بن الهيثم"]],"MT_EGY":["الحياة زي لعبة الشطرنج، لازم تفكر كام خطوة لقدام، لكن في الآخر اللي بيحدد مين يفوز مش بس العقل، ده القلب اللي بيستحمل الخسارة.","الصبر مش بس إنك تستنى، ده إنك تقدر تحلم وسط الوجع، وتفضل شايف النور حتى لو الدنيا كلها بتقولك إن مفيش حاجة هتتغير.","الوحدة مش إنك تبقى لوحدك، دي إنك تحس إنك غريب وسط ناس بتحبهم، ومع ذلك تقدر تبتسم عشان ما تحسسهمش إنك تايه جواك.","الناس بتشوف اللي عينيها شايفاه، لكن اللي بيفهم الحقيقة هو اللي بيسمع الصوت اللي ورا الكلام، اللي الكل بيعدي عليه من غير ما ياخد باله.","الحلم مش حاجة تشتريها، ده حاجة تبنيها جواك حجر حجر، ولو وقعت لازم تكون عندك الشجاعة إنك تبدأ من الأول من غير ما تلوم الزمن.","الخوف زي الضل، لو هربت منه بيطلع أكبر، لكن لو وقفت وقابلته بيختفي، والسر إنك تعرف إن اللي بيخوفك هو نفسك مش اللي قدامك.","السعادة مش حاجة تدور عليها برا، دي زي بذرة جواك، لو سقيتها بحب وصبر هتنبت، لكن لو سبتها للنسيان هتموت من غير ما تاخد خبر.","الزمن مش عدوك، ده مرايتك، بيوريك اللي كنت عايز تبقاه واللي فعلاً بقيته، والحكمة إنك تتعلم منه من غير ما تكرهه على اللي فات.","الكدبة اللي بنصدقها عن نفسنا أخطر من أي كدبة حد يقولها، لأنها بتبني سجن جواك، وبتخليك عايش في حياة مش بتاعتك أصلاً.","النهاية مش دايماً خسارة، أحياناً تكون بداية لطريق ماكنتش شايفه، لكن لازم عينيك تكون مفتوحة عشان تلحق تشوف الفرصة وهي جاية.","الحب مش كلام حلو وخلاص، ده اختبار للقلب، لو قدر يستحمل الجرح ويفضل يدي، يبقى ده الحب اللي يستاهل إنك تعيش عشان تفهمه.","اللي بيسيب أثره في الدنيا مش اللي بيتكلم كتير، ده اللي بيعمل حاجة صغيرة لكنها بتفضل عايشة في قلوب الناس حتى لو هو مش موجود.","القوة مش في إنك تكسر اللي قدامك، دي في إنك تقدر تبني نفسك من جديد كل ما تحس إنك وقعت، وتفضل ماشي مهما الطريق كان صعب.","الصوت اللي جواك لو سمعته كويس هيوديك للحقيقة، لكن لو سبت ضوضاء الدنيا تغطي عليه، هتفضل تايه بين اختيارات مش بتاعتك أصلاً.","الدنيا زي الموج، ساعة بترفعك وساعة بتهدك، والحكمة إنك تتعلم تسبح معاها من غير ما تخاف، لأن اللي بيخاف بيغرق في الأول.","اللي بيخلّص من خوفه من الناس بيلاقي نفسه، لأن أكبر قيد في الحياة هو إنك تعيش عشان ترضي غيرك وتنسى إنت مين في الأساس.","الفرح مش حاجة كبيرة دايماً، أحياناً بيكون لحظة صغيرة، لكن لو عرفت تتمسك بيها هتحس إن الدنيا كلها بقت ملكك لثانية واحدة.","اللي بيفكر إن الحياة هتستناه غلطان، الزمن بيجري ومش بيرحم، واللي عايز يعيش لازم يلحق يعمل حاجة قبل ما الستارة تنزل عليه.","القلب اللي بيستحمل الصعاب من غير ما يكره الدنيا هو اللي بيستاهل النور، لأن اللي بيكره بيخسر فرصة إنه يشوف الجمال تاني.","الحقيقة زي المية، لو حاولت تخبيها هتفضل تدور على طريق تطلع منه، والشاطر اللي يعرف يشوفها قبل ما تغرقه وهو مش داري.","اللي بيحلم كتير بيخاف أقل، لأن الحلم بيديله أمل يشيل بيه الخوف، واللي ما بيحلمش بيسيب الخوف يقعد جنبه كل يوم زي ضيفه.","الطريق الصح مش دايماً اللي الناس بتمدحه، أحياناً بيكون اللي محدش شايفه، لكن قلبك هو اللي بيحس إنه هو ده اللي ليك.","الصبر نبع مش بينشف.","العقل زينة والقلب بوصلة.","خليك نخلة، واقفة في وش الريح.","الكلمة الحلوة مفتاح القلوب المقفولة.","ما تخافش من الغلط، خاف من عدم المحاولة.","العتمة بتخوف بس مبتقتلش، الخوف هو اللي بيقتل.","السكوت مش ضعف، أحياناً بيكون أقوى من أي صراخ.","القلب العطشان بيشرب من أي بير، والعاقل بيختار مية الينبوع.","الحياة مش هدية، دي أمانة لازم نعرف نرجعها أحسن ما استلمناها.","اللي بيكتب قصته بإيده ما بيحتاجش حد يحكي عنه في غيابه.","الفكرة اللي بتخطر في بالك لحظة ما تصحى من النوم ممكن تكون هي اللي تغير حياتك كلها، بس لازم تاخد بالك منها وتكتبها قبل ما الدنيا تشغلك وتخليك تنساها. الأفكار زي الفرص، مش بتيجي كتير، وأحياناً بتيجي مرة واحدة بس، واللي بيعرف يمسكها هو اللي بيعرف يغير مساره وبالتالي يغير حياته، لكن اللي بيسيبها تروح مع الريح بيفضل في نفس المكان سنين طويلة من غير ما يحس.","الانكسار مش نهاية الحكاية، ده أحياناً بيكون أحلى جزء فيها، لما تتجمع من بعد التكسير، وتعمل من نفسك حاجة جديدة مختلفة. اللي اتكسر مرة بيبقى عارف إن الدنيا مش مستاهلة الخوف، وإن اللي بنخاف منه ممكن يكون هو سبب قوتنا بعدين. كل واحد فينا فيه قطع مكسورة، بس الفرق مش في الكسر، الفرق في طريقة لمها وإعادة تشكيلها من جديد.","اللي بيكتب على المية بيستغرب ليه الكلام ما بيثبتش، واللي بيزرع في الصخر بيستغرب ليه البذرة ما طلعتش، واللي بيرمي في الناس قنابل كراهية بيستغرب ليه الناس بتبعد عنه. كل حاجة في الدنيا دي ليها قانونها، زي الجاذبية كده، ما بتستأذنش حد ولا بتميز بين غني وفقير، واللي بيرمي حاجة لفوق لازم يستنى رجوعها لتحت، والسؤال مش هترجع ولا لأ، السؤال هترجع على دماغ مين.","الكلمة اللي بتقولها النهاردة ممكن تطلع بكرة من بعيد زي عصفور، تيجي تحط على كتفك وتفكرك بيها، أو تيجي زي حجر يخبط في دماغك. إحنا بنرمي الكلام في الهوا وبننساه، لكن الكلام ما بينساش طريقه لصاحبه. قبل ما تتكلم على حد، افتكر إن الكلام طاقة مش مجرد أصوات، وكل طاقة لازم تعمل شغل، يا إما هتبني يا إما هتهد، والاختيار في النهاية بيكون بتاعك.","الخسارة هي أعظم معلم في الحياة، بتقولك مين بيحبك بجد ومين كان معاك عشان مصلحة، بتعرفك قد إيه أنت قوي لما تقدر تقف من تاني، وبتوريك إن الدنيا مش نهايتها تقف. وأحياناً اللي بتعتبره خسارة النهاردة بتلاقيه بكرة كان نعمة ما شفتهاش، زي الباب اللي بيتقفل في وشك عشان يجبرك تفتح باب تاني ما كنتش تعرف حتى إنه موجود، والسر إنك في وقت الخسارة تفضل فاكر إن فيه حكمة، حتى لو مش شايفها.","الطريق اللي بتمشي فيه لوحدك هو اللي هيعلمك أقوى الدروس، مش الطريق اللي مليان ناس. لما تتوه لوحدك وتلاقي طريقك، بتتعلم تثق في نفسك. لما تقع من غير ما حد يشوفك وتقوم تاني، بتتعلم إن الوقوع مش عيب. لما تقابل خوفك من غير ما حد يسندك، بتتعلم إنك أقوى مما كنت فاكر. الوحدة مش نقمة زي ما الناس فاكرة، دي نعمة لو عرفت تستغلها صح، لأنها بتجبرك تشوف نفسك على حقيقتها من غير أي فلاتر.","المسامحة مش معناها تقبل الظلم، ولا معناها تنسى اللي حصل، ولا حتى معناها إنك ترجع العلاقة زي الأول. المسامحة معناها إنك تحرر نفسك من التعلق بالألم، وتسيب مكان لحاجات جديدة تيجي في حياتك. كتير مننا بيفتكر إن المسامحة هدية للي أذاك، وده خطأ كبير، لأن المسامحة الحقيقية مش للتاني، دي ليك إنت، عشان ما تفضلش حامل جوه قلبك سم بيأذيك إنت الأول قبل أي حد.","النجاح مش هدف، ده رحلة بتتغير معالمها كل يوم. اللي بيحط النجاح قدامه كنقطة وصول وبيربط سعادته بيها بيفضل يجري طول عمره من غير ما يحس بطعم الحياة. النجاح الحقيقي إنك تطور نفسك كل يوم شوية، تبقى أحسن من امبارح، وتقدر تحب مين حواليك، وتعمل حاجة مفيدة للناس. لما بتقيس نجاحك بالمقارنة بغيرك، فاكر إنك مش هتوصل أبداً للي نفسك فيه، لكن لما بتقيسه بالمقارنة بنفسك، هتكتشف قد إيه إنت بتتطور كل يوم.","الحب مش كلمة واحدة، ده آلاف الكلمات اللي ما اتقالتش، وآلاف اللحظات اللي اتعاشت في سكون، من غير تصوير أو إعلان. الحب هو الراجل اللي بيسمع مراته وهي بتتكلم عن يومها كل يوم بنفس الاهتمام. الحب هو الست اللي بتدعي لجوزها وهو نايم جنبها. الحب هو الابن اللي لما يكبر يفضل فاكر تعب أمه وأبوه. الحب مش مجرد مشاعر، ده قرار بتاخده كل يوم، مليون مرة، في المواقف الصغيرة قبل الكبيرة.","الحياة مش محطة واحدة كبيرة تنزل فيها وتستنى، دي رحلة فيها آلاف المحطات، كل محطة ليها طعم مختلف، ومناظر مختلفة، وناس مختلفة. والسر في الرحلة دي إنك تتعلم تستمتع باللحظة اللي إنت فيها، من غير ما تستعجل المحطة اللي جاية، أو تفضل حاسس بالحنين للمحطة اللي فاتت. عمر ما كانت الحياة برواز واحد وخلاص، دي لوحة بتتكون قدامك كل يوم، وأحياناً أحلى جزء فيها هو اللي لسه ما اترسمش."],"MT_WORDS":["بلاش","بسرعة","اوعى","انبسط","انفعل","اتفرج","كوبري","اتعصب","اتخانق","اتجنن","اتكسف","اتاخر","اتنرفز","فلافل","سيف","اتهد","ارتاح","اترعب","جاب","ورا","زعق","ازعل","ما","تروحش","تقولش","تعملش","تشيلش","هم","تاخدش","بالك","تسمعش","كلام","تشيرش","تتوقعش","تعرفش","تقدرش","تجدش","تتكلمش","مش","قادر","على","قد","اقدر","تقلقش","تخافش","تزعلش","كده","تنساش","تتفكرش","تكبرش","الموضوع","تلفش","الدنيا","تيجيش","استنى","استغل","استخدم","استعجل","استعبط","فاق","غيبوبة","استقل","استمتع","استمر","سرسجي","استنجد","استوعب","اشترى","اشتاق","اشتكى","اشترك","اشتبك","عايز","إيه","شجع","اصحى","اضحك","اطلع","افطر","اقتنع","سرايا","كنبة","اكتشف","التزم","العب","مرهم","امبارح","انتقم","انشرح","انصح","انطق","انقذ","اهتم","ايجار","ايميل","ابعد","اتاسف","اتجاهل","اتحرك","اتخلى","اتزود","اتسحلنا","اطمئن","اتعاقب","بعضه","اخرس","اتعدى","حدودك","العادي","اتغدى","اتفضل","اتقدم","اتمرن","علق","سليم","السريع","تكة","اتهرشت","اسلك","خبرة","مزاجي","خربان","اتمنى","اتنفس","اتهزأ","اتوصى","اجمد","اجيب","اخلص","اخلي","شغال","اخوفك","اديني","اروح","اسالك","اسكت","اسمعني","اسمه","اسود","اشوفك","اصفر","اعرفك","افتكر","افوت","جمل","اقفل","اكيد","البس","الناحية","الورق","امشي","انزل","اهرب","اوكي","ايدي","ايوه","بأمانة","بإيدك","بإيدي","باخد","بشوف","باظ","بقول","البيت","بالذمة","بالراحة","بالزبط","بالعكس","بالليل","بالنهار","لابتوب","بوتاجاز","تعبان","بنزل","بهرب","باي","بتاعنا","بتتكلم","كوشة","بتدور","بتشوف","بتعملي","ابلة","بتقول","بتلاقي","بتمشي","بتنزل","بتهرب","بتهم","بجيب","ب   masry:()=>MASRY.map(t=>({t,s:"مثل شعبي مصري"})),
  kalam:()=>KALAM.map(t=>({t,s:"كلام مصري"})).concat(MT_EGY.map(t=>({t,s:"كلام مصري · من اقتباسات Monkeytype"}))),
  hawadit:()=>HAWADIT.map(([t,s])=>({t,s})),
  hekam:()=>HEKAM.map(([t,s])=>({t,s})),
  sheer:()=>SHEER.map(([t,s])=>({t,s}))
};
function allQuotes(){
  const keys=(cfg.src==="mix"||cfg.src==="words")?Object.keys(CATS):[cfg.src];
  return keys.flatMap(k=>CATS[k]());
}
function lenCat(t){const n=t.length;return n<70?"s":n<180?"m":n<320?"l":"xl";}

/* شنطة بتلف على كل النصوص قبل ما تكرر */
const bags={};
function draw(key,list){
  let b=bags[key]; if(!b||!b.length) b=bags[key]=shuffle(list);
  return b.pop();
}
let gen=null;
function makeGen(){
  if(cfg.src==="words"){
    let last="";
    return ()=>{const out=[];for(let i=0;i<20;i++){let w;do{w=WORDS[Math.random()*WORDS.length|0];}while(w===last);last=w;out.push(clean(w));}return out.join(" ").split(" ").filter(Boolean);};
  }
  const qs=allQuotes(), key="stream-"+cfg.src;
  return ()=>clean(draw(key,qs).t).split(" ").filter(Boolean);
}

/* ============ حالة الاختبار ============ */
let T;
function fresh(words,quote){
  return {words,typed:[""],idx:0,started:false,done:false,t0:0,ok:0,bad:0,secKeys:0,secErr:0,samples:[],nextSec:1,timer:null,quote};
}
function buildWords(){
  gen=makeGen();
  if(cfg.mode==="quote"){
    let qs=allQuotes(); if(cfg.qlen!=="all"){const f=qs.filter(q=>lenCat(q.t)===cfg.qlen); if(f.length) qs=f;}
    const q=draw("q-"+cfg.src+"-"+cfg.qlen,qs);
    return {words:clean(q.t).split(" ").filter(Boolean),quote:q,count:qs.length};
  }
  const need=cfg.mode==="words"?cfg.words:90; let w=[];
  while(w.length<need) w=w.concat(gen());
  if(cfg.mode==="words") w=w.slice(0,cfg.words);
  return {words:w,quote:null};
}
/* تاريخ النصوص: Tab للي بعده، Shift+Tab للي قبله */
let hist=[], hpos=-1;
function go(dir){
  if(dir===0&&hpos>=0){ /* نفس النص */ }
  else if(dir<0){ if(hpos>0) hpos--; else return flashNav("ده أول نص"); }
  else if(hpos<hist.length-1){ hpos++; }
  else { hist.push(buildWords()); if(hist.length>50) hist.shift(); hpos=hist.length-1; }
  start(hist[hpos]);
}
function resetHistory(){ hist=[]; hpos=-1; go(1); }
function flashNav(msg){ $("navhint").textContent=msg; clearTimeout(flashNav.t); flashNav.t=setTimeout(updateNav,1200); }
function updateNav(){
  const b=hist[hpos]; let s="";
  if(cfg.mode==="quote"&&b&&b.count) s="نص "+AR_NUM(hpos+1)+" · فيه "+AR_NUM(b.count)+" نص في القسم ده";
  $("navhint").textContent=s;
}
function start(b){
  if(T&&T.timer) clearInterval(T.timer);
  setTyping(false);
  gen=makeGen();
  T=fresh(b.words.slice(),b.quote);
  $("results").hidden=true; $("stage").hidden=false;
  wordsEl.style.transform="";
  wordsEl.innerHTML=T.words.map((_,i)=>`<span class="w">${letters(i)}</span>`).join("");
  ti.value="";
  $("src").textContent=T.quote?("— "+T.quote.s):"";
  $("live").textContent="";
  updateNav(); updateCounter(); refresh(); showPB();
  focusInput();
}
function letters(i){
  const tg=T.words[i], ty=T.typed[i]||""; let h="";
  const n=Math.max(tg.length,ty.length);
  for(let j=0;j<n;j++){
    if(j<tg.length){const cls=j<ty.length?(eq(ty[j],tg[j])?"ok":"bad"):""; h+=`<span class="${cls}">${esc(tg[j])}</span>`;}
    else h+=`<span class="extra">${esc(ty[j])}</span>`;
  }
  return h;
}
function wordCorrect(i){const a=T.typed[i]||"",b=T.words[i];if(a.length!==b.length)return false;for(let j=0;j<a.length;j++)if(!eq(a[j],b[j]))return false;return true;}
function prefixOk(i){const a=T.typed[i]||"",b=T.words[i]||"";if(a.length>b.length)return false;for(let j=0;j<a.length;j++)if(!eq(a[j],b[j]))return false;return true;}
function updateWord(i){
  const el=wordsEl.children[i]; if(!el) return;
  el.innerHTML=letters(i);
  el.classList.toggle("err", i<T.idx && !wordCorrect(i));
}
function appendWords(){
  let add=[]; while(add.length<40) add=add.concat(gen());
  const startI=T.words.length; T.words=T.words.concat(add);
  const frag=document.createDocumentFragment();
  for(let i=startI;i<T.words.length;i++){const s=document.createElement("span");s.className="w";s.innerHTML=letters(i);frag.appendChild(s);}
  wordsEl.appendChild(frag);
}

/* ============ الإدخال ============ */
function startTest(){ T.started=true; T.t0=performance.now(); T.timer=setInterval(tick,100); setTyping(true); }
function setTyping(on){ document.body.classList.toggle("typing",!!on); }
document.addEventListener("mousemove",e=>{ if(Math.abs(e.movementX)+Math.abs(e.movementY)>3) setTyping(false); });
function setTyped(nv){
  const old=T.typed[T.idx]; if(nv===old) return;
  if(!T.started&&nv.length) startTest();
  const tg=T.words[T.idx];
  let k=0; while(k<old.length&&k<nv.length&&old[k]===nv[k]) k++;
  for(let j=k;j<nv.length;j++){
    const good=j<tg.length&&eq(nv[j],tg[j]);
    if(good)T.ok++;else{T.bad++;T.secErr++;flashBad();}
    T.secKeys++;
  }
  T.typed[T.idx]=nv; updateWord(T.idx);
  if(cfg.mode!=="time"&&T.idx===T.words.length-1&&wordCorrect(T.idx)) finish();
}
function commitWord(){
  const i=T.idx, good=wordCorrect(i);
  if(good)T.ok++;else{T.bad++;T.secErr++;}
  T.secKeys++;
  if(i===T.words.length-1&&cfg.mode!=="time"){finish();return;}
  T.idx++; T.typed[T.idx]="";
  updateWord(i); updateWord(T.idx);
  if(cfg.mode==="time"&&T.words.length-T.idx<40) appendWords();
}
ti.addEventListener("input",()=>{
  if(T.done){ti.value="";return;}
  if(T.started) setTyping(true);
  let v=ti.value.replace(/\n/g," ").replace(/[ﻻﻹﻷﻵ]/g,m=>({"ﻻ":"لا","ﻹ":"لإ","ﻷ":"لأ","ﻵ":"لآ"}[m]));
  if(cfg.lenient) v=v.replace(TASHKEEL,"");
  const parts=v.split(" ");
  for(let p=0;p<parts.length;p++){
    setTyped(parts[p]); if(T.done) break;
    if(p<parts.length-1){ if(!T.typed[T.idx].length) continue; commitWord(); if(T.done) break; }
  }
  ti.value=T.done?"":T.typed[T.idx];
  refresh();
});
ti.addEventListener("keydown",e=>{
  if(e.key==="Backspace"&&ti.value===""&&T.idx>0&&!T.done&&!wordCorrect(T.idx-1)){
    e.preventDefault(); T.typed[T.idx]=""; updateWord(T.idx); T.idx--; ti.value=T.typed[T.idx];
    updateWord(T.idx); refresh();
  }
});
ti.addEventListener("focus",()=>{slab.classList.remove("blur");fmsg.hidden=true;});
ti.addEventListener("blur",()=>{ if(!T.done){slab.classList.add("blur");fmsg.hidden=false;} });
function focusInput(){ if(!$("tpanel").hidden) return; try{ti.focus({preventScroll:true});}catch(e){ti.focus();} }

document.addEventListener("keydown",e=>{
  const panelOpen=!$("tpanel").hidden;
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.code==="KeyP")){e.preventDefault(); panelOpen?closeThemes(true):openThemes(); return;}
  if(panelOpen){
    if(e.key==="Escape"){e.preventDefault();closeThemes(false);}
    return;
  }
  pressKey(e.code,true);
  if(e.key==="Tab"){ e.preventDefault(); go(e.shiftKey?-1:1); return; }
  if(e.key==="Escape"){ e.preventDefault(); go(0); return; }
  if(!$("results").hidden&&e.key==="Enter"&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();go(1);return;}
  if(document.activeElement!==ti&&$("results").hidden&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&document.activeElement.tagName!=="BUTTON"&&document.activeElement.tagName!=="INPUT") focusInput();
});
document.addEventListener("keyup",e=>pressKey(e.code,false));
window.addEventListener("blur",()=>document.querySelectorAll(".k.press").forEach(k=>k.classList.remove("press")));

/* ============ العرض ============ */
let caretIdle;
function refresh(){
  if(!T||T.done) return;
  const w=wordsEl.children[T.idx]; if(!w) return;
  for(let i=Math.max(0,T.idx-60);i<T.idx;i++) wordsEl.children[i].classList.toggle("err",!wordCorrect(i));
  const lh=w.offsetHeight||72; slab.style.setProperty("--lh",lh+"px");
  const shift=Math.max(0,w.offsetTop-lh);
  wordsEl.style.transform=shift?`translateY(${-shift}px)`:"";
  placeCaret(); updateCounter(); updateKb();
  caret.classList.remove("idle"); clearTimeout(caretIdle); caretIdle=setTimeout(()=>caret.classList.add("idle"),600);
}
function placeCaret(){
  const w=wordsEl.children[T.idx]; if(!w) return;
  const box=slab.getBoundingClientRect(), ty=T.typed[T.idx]||"", L=w.children;
  let r,x;
  if(!ty.length||!L.length){r=w.getBoundingClientRect();x=r.right+1;}
  else{ let j=Math.min(ty.length,L.length)-1; r=L[j].getBoundingClientRect(); while(r.width===0&&j>0){j--;r=L[j].getBoundingClientRect();} x=r.left-1; r=w.getBoundingClientRect(); }
  caret.style.height=(r.height*0.56)+"px";
  caret.style.transform=`translate(${x-box.left-1}px,${r.top-box.top+r.height*0.24}px)`;
}
function updateCounter(){
  const c=$("counter");
  if(cfg.mode==="time"){
    const el=T.started?(performance.now()-T.t0)/1000:0;
    c.textContent=AR_NUM(Math.max(0,Math.ceil(cfg.time-el)));
  } else c.textContent=AR_NUM(T.idx)+" / "+AR_NUM(T.words.length);
}
function correctChars(){
  let n=0; for(let i=0;i<T.idx;i++) if(wordCorrect(i)) n+=T.words[i].length+1;
  if(prefixOk(T.idx)) n+=(T.typed[T.idx]||"").length;
  return n;
}
function tick(){
  if(T.done) return;
  const el=(performance.now()-T.t0)/1000;
  while(el>=T.nextSec){ pushSample(T.nextSec); T.nextSec++; }
  updateCounter();
  if(el>=1) $("live").textContent=AR_NUM(Math.round(correctChars()/5/(el/60)))+" كلمة/دقيقة";
  if(cfg.mode==="time"&&el>=cfg.time) finish();
}
function pushSample(s){ T.samples.push({s,wpm:correctChars()/5/(s/60),raw:T.secKeys*12,err:T.secErr}); T.secKeys=0;T.secErr=0; }

/* ============ النتيجة ============ */
function finish(){
  if(T.done) return; T.done=true; clearInterval(T.timer); setTyping(false);
  let el=cfg.mode==="time"?cfg.time:(performance.now()-T.t0)/1000;
  el=Math.max(el,0.5);
  const frac=el-(T.nextSec-1);
  if(frac>0.4||!T.samples.length){T.samples.push({s:+el.toFixed(1),wpm:correctChars()/5/(el/60),raw:T.secKeys*(60/Math.max(frac,0.5))/5,err:T.secErr});}
  const cc=correctChars();
  const wpm=cc/5/(el/60), total=T.ok+T.bad, raw=total/5/(el/60), acc=total?T.ok/total*100:0;
  let c=0,b=0,x=0,m=0;
  for(let i=0;i<=T.idx&&i<T.words.length;i++){
    const tg=T.words[i],ty=T.typed[i]||"";
    for(let j=0;j<Math.max(tg.length,ty.length);j++){
      if(j>=tg.length)x++;else if(j>=ty.length){if(i<T.idx||cfg.mode!=="time")m++;}else if(eq(ty[j],tg[j]))c++;else b++;
    }
  }
  const key=pbKey(), pbs=getPBs(), prev=pbs[key];
  const isPB=wpm>0&&acc>=75&&(!prev||wpm>prev.wpm);
  if(isPB){pbs[key]={wpm:Math.round(wpm),acc:Math.round(acc)};setPBs(pbs);}
  showResults({wpm,raw,acc,c,b,x,m,el,isPB,prev});
  ti.blur(); updateKb();
}
const SRC_NAME={masry:"أمثال مصرية",kalam:"كلام مصري",hawadit:"حواديت",hekam:"حكم وتراث",sheer:"شعر",mix:"مكس",words:"كلمات"};
function modeLabel(){
  const m=cfg.mode==="time"?AR_NUM(cfg.time)+" ثانية":cfg.mode==="words"?AR_NUM(cfg.words)+" كلمة":"اقتباس "+({all:"",s:"قصير",m:"متوسط",l:"طويل",xl:"طويل جدا"}[cfg.qlen]);
  return m.trim()+" · "+SRC_NAME[cfg.src];
}
function pbKey(){return [cfg.mode,cfg.mode==="time"?cfg.time:cfg.mode==="words"?cfg.words:cfg.qlen,cfg.src].join("-");}

function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function drawChart(){
  const cv=$("chart"); if(!cv||!T) return;
  const S=T.samples; const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  const pl=34,pr=10,pt=10,pb=24, iw=W-pl-pr, ih=H-pt-pb;
  const mx=Math.max(10,...S.map(s=>Math.max(s.wpm,s.raw)));
  const top=Math.ceil(mx*1.1/10)*10;
  const n=S.length; const X=i=>pl+(n<=1?iw/2:i/(n-1)*iw); const Y=v=>pt+ih-(v/top)*ih;
  ctx.font="11px "+tok("--f-ui"); ctx.fillStyle=tok("--sub"); ctx.strokeStyle=tok("--line"); ctx.lineWidth=1;
  ctx.textAlign="right"; ctx.textBaseline="middle";
  for(let g=0;g<=4;g++){const v=top*g/4,y=Y(v);ctx.beginPath();ctx.moveTo(pl,y);ctx.lineTo(W-pr,y);ctx.stroke();ctx.fillText(Math.round(v),pl-6,y);}
  ctx.textAlign="center"; ctx.textBaseline="top";
  const step=Math.max(1,Math.ceil(n/8));
  S.forEach((s,i)=>{if(i%step===0||i===n-1)ctx.fillText(Math.round(s.s),X(i),H-pb+6);});
  ctx.strokeStyle=tok("--sub"); ctx.lineWidth=1.5; ctx.beginPath(); S.forEach((s,i)=>i?ctx.lineTo(X(i),Y(s.raw)):ctx.moveTo(X(i),Y(s.raw))); ctx.stroke();
  const acc=tok("--accent");
  ctx.globalAlpha=.13; ctx.fillStyle=acc; ctx.beginPath(); ctx.moveTo(X(0),Y(0)); S.forEach((s,i)=>ctx.lineTo(X(i),Y(s.wpm))); ctx.lineTo(X(n-1),Y(0)); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle=acc; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.beginPath(); S.forEach((s,i)=>i?ctx.lineTo(X(i),Y(s.wpm)):ctx.moveTo(X(i),Y(s.wpm))); ctx.stroke();
  if(n){ctx.fillStyle=acc;ctx.beginPath();ctx.arc(X(n-1),Y(S[n-1].wpm),3.5,0,7);ctx.fill();}
  ctx.fillStyle=tok("--err");
  S.forEach((s,i)=>{if(s.err){ctx.beginPath();ctx.arc(X(i),pt+6,Math.min(2+s.err,6),0,7);ctx.fill();}});
}
window.addEventListener("resize",()=>{ if(T&&T.done) drawChart(); else if(T) refresh(); });

function buildKb(){

    if(b&&!(b in KMAP)) KMAP[b]={code,shift:false};
    if(s&&!(s in KMAP)) KMAP[s]={code,shift:true};
    return `<div class="k ${F[code]||""}" data-code="${code}">${lat}${s?`<span class="sh">${esc(s)}</span>`:""}${esc(b)}</div>`;
  };
  const fn=(code,label)=>`<div class="k" data-code="${code}"><span class="fn">${label}</span></div>`;
  let h="";
  h+=`<div class="row r0">${CODES[0].map((c,i)=>key(c,L[0][i][0],L[0][i][1])).join("")}${fn("Backspace","⌫")}</div>`;
  h+=`<div class="row r1">${fn("Tab","Tab")}${CODES[1].map((c,i)=>key(c,L[1][i][0],L[1][i][1])).join("")}</div>`;
  h+=`<div class="row r2">${fn("CapsLock","Caps")}${CODES[2].map((c,i)=>key(c,L[2][i][0],L[2][i][1])).join("")}${fn("Enter","Enter")}</div>`;
  h+=`<div class="row r3">${fn("ShiftLeft","Shift")}${CODES[3].map((c,i)=>key(c,L[3][i][0],L[3][i][1])).join("")}${fn("ShiftRight","Shift")}</div>`;
  h+=`<div class="row r4">${fn("AltLeft",cfg.layout==="mac"?"⌥":"Alt")}${fn("Space","مسافة")}${fn("AltRight",cfg.layout==="mac"?"⌥":"Alt")}</div>`;
  $("kb").innerHTML=h;
  KMAP[" "]={code:"Space",shift:false};
}
function kEl(code){return document.querySelector(`.k[data-code="${code}"]`);}
function pressKey(code,down){const k=kEl(code);if(k)k.classList.toggle("press",down);}
let badT;
function flashBad(){ if(!cfg.kb) return; const k=kEl("Backspace"); if(!k) return; k.classList.add("flashbad"); clearTimeout(badT); badT=setTimeout(()=>k.classList.remove("flashbad"),180); }
function updateKb(){
  document.querySelectorAll(".k.next").forEach(k=>k.classList.remove("next"));
  if(!cfg.kb||!T||T.done) return;
  const tg=T.words[T.idx]||"", ty=T.typed[T.idx]||"";
  let mark=[];
  if(!prefixOk(T.idx)) mark=["Backspace"];
  else if(ty.length>=tg.length) mark=["Space"];
  else{
    const ch=tg[ty.length];
    const m=KMAP[ch]||KMAP[N(ch)];
    if(m){ mark=[m.code]; if(m.shift) mark.push("ShiftLeft","ShiftRight"); }
  }
  mark.forEach(c=>{const k=kEl(c);if(k)k.classList.add("next");});
}

/* ============ الثيمات (من Monkeytype) ============ */
const THEMES=MT.THEMES; /* [name, isDark, [bg,main,caret,sub,subAlt,text,error,errorExtra]] */
const VARS=["--bg","--panel","--fg","--sub","--accent","--caret","--accent-soft","--err","--err-dim","--line","--key","--key-fg","--key-edge","--scrim"];
function prettyName(n){return n.replace(/_/g," ");}
function applyTheme(name){
  const root=document.documentElement.style;
  const t=THEMES.find(x=>x[0]===name);
  if(!t){ VARS.forEach(v=>root.removeProperty(v)); root.removeProperty("color-scheme"); }
  else{
    const [bg,main,car,sub,subAlt,text,err,errX]=t[2];
    const set={"--bg":bg,"--panel":subAlt,"--fg":text,"--sub":sub,"--accent":main,"--caret":car,"--accent-soft":main+"24",
      "--err":err,"--err-dim":errX,"--line":subAlt,"--key":subAlt,"--key-fg":text,"--key-edge":t[1]?"rgba(0,0,0,.45)":sub+"80","--scrim":"rgba(0,0,0,.5)"};
    for(const k in set) root.setProperty(k,set[k]);
    root.setProperty("color-scheme",t[1]?"dark":"light");
  }
  const tt=THEMES.find(x=>x[0]===name);
  $("tname").textContent=tt?prettyName(name):"طقطقة";
  $("tdots").innerHTML=tt?[tt[2][1],tt[2][3],tt[2][5]].map(c=>`<i style="background:${c}"></i>`).join(""):`<i style="background:var(--accent)"></i><i style="background:var(--sub)"></i><i style="background:var(--fg)"></i>`;
  if(T&&T.done) drawChart(); else if(T) refresh();
}
function renderThemes(){
  const q=$("tsearch").value.trim().toLowerCase().replace(/\s+/g,"_");
  const list=THEMES.filter(t=>(cfg.tfilter==="all"||(cfg.tfilter==="dark")===t[1])&&(!q||t[0].includes(q)));
  const def=(!q&&cfg.tfilter!=="light")?`<button type="button" class="tcard${cfg.theme===""?" cur":""}" data-name="" style="background:#121b1b;color:#e8e2d3"><span>taqtaqa (default)</span><span class="dots"><i style="background:#e2aa3f"></i><i style="background:#5d6c69"></i><i style="background:#e8e2d3"></i></span></button>`:"";
  $("tgrid").innerHTML=def+list.map(t=>{const c=t[2];return `<button type="button" class="tcard${cfg.theme===t[0]?" cur":""}" data-name="${t[0]}" style="background:${c[0]};color:${c[5]}"><span>${prettyName(t[0])}</span><span class="dots"><i style="background:${c[1]}"></i><i style="background:${c[3]}"></i><i style="background:${c[5]}"></i></span></button>`;}).join("");
  $("tcount").textContent=AR_NUM(list.length)+" ثيم · عدّي بالماوس عشان تشوفه قبل ما تختار";
  document.querySelectorAll("#g-tf button").forEach(b=>b.classList.toggle("on",b.dataset.v===cfg.tfilter));
}
function openThemes(){ $("tpanel").hidden=false; $("tsearch").value=""; renderThemes(); setTimeout(()=>$("tsearch").focus(),0); }
function closeThemes(keep){ $("tpanel").hidden=true; applyTheme(cfg.theme); focusInput(); }
$("themebtn").onclick=openThemes;
$("tclose").onclick=()=>closeThemes();
$("tpanel").addEventListener("mousedown",e=>{ if(e.target.id==="tpanel") closeThemes(); });
$("tsearch").addEventListener("input",renderThemes);
$("tsearch").addEventListener("keydown",e=>{ if(e.key==="Enter"){const f=$("tgrid").querySelector(".tcard"); if(f){cfg.theme=f.dataset.name;saveCfg();closeThemes();}} });
$("g-tf").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cfg.tfilter=b.dataset.v;saveCfg();renderThemes();});
$("tgrid").addEventListener("click",e=>{const b=e.target.closest(".tcard");if(!b)return;cfg.theme=b.dataset.name;saveCfg();closeThemes();});
$("tgrid").addEventListener("mouseover",e=>{const b=e.target.closest(".tcard");if(b)applyTheme(b.dataset.name);});
$("tgrid").addEventListener("focusin",e=>{const b=e.target.closest(".tcard");if(b)applyTheme(b.dataset.name);});
$("tgrid").addEventListener("mouseleave",()=>applyTheme(cfg.theme));

/* ============ أزرار الإعدادات ============ */
function syncConfig(){
  if(cfg.mode==="quote"&&cfg.src==="words") cfg.src="mix";
  document.querySelectorAll(".config .group[data-k], #g-layout").forEach(g=>{
    const k=g.dataset.k;
    g.querySelectorAll("button").forEach(b=>{ const on=String(cfg[k])===b.dataset.v; b.classList.toggle("on",on); b.setAttribute("aria-pressed",on); });
  });
  document.querySelectorAll(".tog").forEach(b=>{b.classList.toggle("on",!!cfg[b.dataset.t]);b.setAttribute("aria-pressed",!!cfg[b.dataset.t]);});
  const counts={s:0,m:0,l:0,xl:0}; allQuotes().forEach(q=>counts[lenCat(q.t)]++);
  if(cfg.qlen!=="all"&&!counts[cfg.qlen]) cfg.qlen="all";
  document.querySelectorAll("#g-qlen button").forEach(b=>{ const v=b.dataset.v; if(v!=="all"){ b.disabled=!counts[v]; b.title=counts[v]?AR_NUM(counts[v])+" نص":"مفيش نصوص بالطول ده هنا"; } b.classList.toggle("on",cfg.qlen===v); });
  $("g-time").hidden=cfg.mode!=="time"; $("g-words").hidden=cfg.mode!=="words"; $("g-qlen").hidden=cfg.mode!=="quote";
  document.querySelector('.group[data-k="src"] button[data-v="words"]').disabled=cfg.mode==="quote";
  $("kbwrap").hidden=!cfg.kb;
  const de=document.documentElement;
  de.classList.toggle("tf-serif",cfg.tfont==="serif");
  de.classList.remove("ts-s","ts-l"); if(cfg.tsize!=="m") de.classList.add("ts-"+cfg.tsize);
}
$("config").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b||b.disabled) return;
  const g=b.closest(".group[data-k]");
  if(g){ const k=g.dataset.k; cfg[k]=(k==="time"||k==="words")?+b.dataset.v:b.dataset.v; }
  else if(b.dataset.t){ cfg[b.dataset.t]=!cfg[b.dataset.t]; }
  saveCfg(); syncConfig(); b.blur();
  if(b.dataset.t==="kb"){ if(!T.done){updateKb();focusInput();} return; }
  if(g&&(g.dataset.k==="tfont"||g.dataset.k==="tsize")){ if(T&&!T.done) requestAnimationFrame(()=>{refresh();focusInput();}); else if(T&&T.done) drawChart(); return; }
  if(b.dataset.t==="lenient"&&T&&!T.done){ for(let i=0;i<=T.idx;i++) updateWord(i); refresh(); focusInput(); return; }
  resetHistory();
});
$("g-layout").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  cfg.layout=b.dataset.v; saveCfg(); syncConfig(); buildKb(); b.blur(); updateKb(); if(T&&!T.done) focusInput();
});
slab.addEventListener("mousedown",e=>{ if(e.target!==ti){e.preventDefault();focusInput();} });

syncConfig(); buildKb(); applyTheme(cfg.theme);
resetHistory();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(T&&!T.done) refresh(); });
})();
</script>
